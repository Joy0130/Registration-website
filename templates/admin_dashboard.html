{% extends "layout.html" %}
{% block title %}後台管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">課程管理</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('all_registrations') }}" class="btn btn-custom-purple-outline me-2">查看所有報名紀錄</a>
        <a href="{{ url_for('new_course') }}" class="btn btn-primary">新增課程</a>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>課程名稱</th>
                <th>上課時間</th>
                <th>狀態</th>
                <th>開放報名時間</th>
                <th>報名截止時間</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="admin-course-list">
            </tbody>
    </table>
</div>

<div class="modal fade" id="registrantsModal" tabindex="-1" aria-labelledby="registrantsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registrantsModalLabel">報名者列表</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <table class="table">
            <thead>
                <tr><th>使用者名稱</th><th>上課時間</th><th>報名時間</th></tr>
            </thead>
            <tbody id="registrantsList">
            </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
