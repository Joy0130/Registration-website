{% extends "layout.html" %}

{% block body_class %}login-page-background{% endblock %}
{% block navbar_classes %}navbar-light navbar-transparent{% endblock %}
{% block title %}忘記密碼{% endblock %}
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-11 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        
        <div class="card shadow-lg rounded-4">
            <div class="card-header bg-transparent border-bottom-0">
                <h5 class="card-title text-center mb-0">忘記密碼</h5>
            </div>
            <div class="card-body p-4 p-md-5">
                <p class="text-muted text-center mb-4">請輸入您註冊時使用的電子郵件地址，我們將發送新密碼到您的信箱。</p>
                
                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" required placeholder="電子郵件">
                        <label for="email">電子郵件</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">發送新密碼</button>
                </form>
                
                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-muted small">← 返回登入頁面</a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
