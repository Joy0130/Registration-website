<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有報名紀錄</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<!-- START: Firebase SDKs (v8 compat version) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<!-- END: Firebase SDKs -->

<!-- 您的主要 JavaScript 檔案 (務必放在 Firebase SDK 之後) -->
<script src="/js/main.js"></script>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">所有報名紀錄</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a id="export-excel-btn" href="#" class="btn btn-sm btn-outline-success me-2" title="匯出 Excel">
                <i class="bi bi-file-earmark-spreadsheet-fill "> 匯出 Excel</i>
            </a>
            <a href="#" class="btn btn-sm btn-secondary">返回課程管理</a>
        </div>
    </div>
    
    <p class="text-muted"><i class="bi bi-lightbulb-fill text-warning"></i> 會依照您篩選的結果匯出報名紀錄</p>
    
    <form method="GET" action="#" class="mb-4 p-3 border rounded bg-light">
        <div class="row g-3 align-items-center">
            <div class="col-md-2">
                <label for="registration_id" class="form-label">報名 ID</label>
                <input type="number" class="form-control form-control-sm" id="registration_id" name="registration_id" placeholder="輸入 ID" value="">
            </div>
    
            <div class="col-md-2">
                <label for="username" class="form-label">使用者名稱</label>
                <input type="text" class="form-control form-control-sm" id="username" name="username" placeholder="輸入名稱" value="">
            </div>
    
            <div class="col-md-2">
                <label for="course_id" class="form-label">報名課程</label>
                <select id="course_id" name="course_id" class="form-select form-select-sm">
                    <option value="">所有課程</option>
                    <option value="course-01">進階 Python 程式設計</option>
                    <option value="course-02">資料庫設計入門</option>
                    <option value="course-03">前端框架 Vue.js 實戰</option>
                </select>
            </div>
    
            <div class="col-md-2">
                <label for="slot_date" class="form-label">上課時間</label>
                <input type="date" class="form-control form-control-sm" id="slot_date" name="slot_date" value="">
            </div>
            <div class="col-md-2">
                <label for="registration_date" class="form-label">報名日期</label>
                <input type="date" class="form-control form-control-sm" id="registration_date" name="registration_date" value="">
            </div>
    
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary btn-sm me-2">篩選</button>
                <a href="#" class="btn btn-outline-secondary btn-sm">清除</a>
            </div>
        </div>
    </form>
    
    <i class="bi bi-info-circle-fill text-info"></i> 總共 3 筆報名紀錄
    
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>報名 ID</th>
                    <th>使用者名稱</th>
                    <th>報名課程</th>
                    <th>上課時間</th>
                    <th>報名時間</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 範例資料 1 -->
                <tr>
                    <td>101</td>
                    <td>Joy</td>
                    <td>進階 Python 程式設計</td>
                    <td>2025-10-11 14:00 ~ 16:00</td>
                    <td>2025-09-20 10:30:15</td>
                    <td>
                        <form class="admin-cancel-form" action="#" method="POST" 
                              data-confirm-message="確定要取消「Joy」的「進階 Python 程式設計」報名嗎？" style="display: inline;">
                            <button type="submit" class="btn btn-outline-danger btn-sm mt-1">取消報名</button>
                        </form>
                    </td>
                </tr>
                <!-- 範例資料 2 -->
                <tr>
                    <td>102</td>
                    <td>Tom</td>
                    <td>資料庫設計入門</td>
                    <td>2025-11-05 09:00 ~ 12:00</td>
                    <td>2025-09-21 15:00:02</td>
                    <td>
                        <form class="admin-cancel-form" action="#" method="POST" 
                              data-confirm-message="確定要取消「Tom」的「資料庫設計入門」報名嗎？" style="display: inline;">
                            <button type="submit" class="btn btn-outline-danger btn-sm mt-1">取消報名</button>
                        </form>
                    </td>
                </tr>
                <!-- 範例資料 3 -->
                <tr>
                    <td>103</td>
                    <td>Mary</td>
                    <td>前端框架 Vue.js 實戰</td>
                    <td>2025-12-01 13:30 ~ 17:30</td>
                    <td>2025-09-22 08:45:55</td>
                    <td>
                        <form class="admin-cancel-form" action="#" method="POST" 
                              data-confirm-message="確定要取消「Mary」的「前端框架 Vue.js 實戰」報名嗎？" style="display: inline;">
                            <button type="submit" class="btn btn-outline-danger btn-sm mt-1">取消報名</button>
                        </form>
                    </td>
                </tr>
                <!-- 如果沒有資料時的顯示方式 -->
                <!--
                <tr>
                    <td colspan="6" class="text-center">找不到符合條件的報名紀錄。</td>
                </tr>
                -->
            </tbody>
        </table>
    </div>
</div>

<!-- 引入 Bootstrap JS 和 Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>


<script>
    // 為了讓靜態頁面也能運作，將 main.js 中的取消確認邏輯直接放在這裡
    document.body.addEventListener('submit', function(event) {
        const form = event.target;
        if (form && form.classList.contains('admin-cancel-form')) {
            const message = form.dataset.confirmMessage || '確定要執行此操作嗎？';
            if (!confirm(message)) {
                event.preventDefault(); // 如果使用者點擊「取消」，就阻止表單提交
            }
        }
    });
</script>
</body>
</html>
