</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">課程報名系統</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-user-section">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">所有課程</a>
                    </li>
                    <!-- 範例：已登入狀態 -->
                    <li class="nav-item">
                        <a class="nav-link" href="my_courses.html">我報名的課</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin_dashboard.html">後台管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">你好, Joy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">登出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="row" id="course-detail-container">
            <div class="col-lg-8 mx-auto">
                <!-- 內容將由 main.js 動態載入 -->
                <h2 id="course-name" class="display-5 fw-bold">載入中...</h2>
                <p class="lead" id="course-status-badge">
                    <span class="badge bg-secondary fs-6">...</span>
                </p>

                <hr>

                <p><strong>主講人：</strong> <span id="course-speaker">...</span></p>
                <p><strong>開放報名：</strong> <span id="course-reg-start">...</span></p>
                <p><strong>截止報名：</strong> <span id="course-reg-end">...</span></p>

                <h3 class="mt-4">課程介紹</h3>
                <div id="course-description" style="white-space: pre-wrap;">...</div>

                <div id="course-files-container"></div>

                <hr class="my-4">

                <!-- 報名區塊將由 main.js 動態載入 -->
                <div id="registration-section"></div>

                <div class="text-center mt-4">
                    <a href="index.html">&laquo; 返回所有課程</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
