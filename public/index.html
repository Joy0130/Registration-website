<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有課程</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 引入自訂樣式 -->
    <style>
        .all-courses-background {
            background-color: #f8f9fa;
        }
    </style>
</head>
<!-- START: Firebase SDKs (v8 compat version) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<!-- END: Firebase SDKs -->

<!-- 您的主要 JavaScript 檔案 (務必放在 Firebase SDK 之後) -->
<script src="/js/main.js"></script>

<body class="all-courses-background">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">課程報名系統</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-user-section">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">所有課程</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my_courses.html">我報名的課</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin_dashboard.html">後台管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">你好, Joy</a> </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">登出</a> </li>

                    </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">所有課程</h1>
        </div>

        <div class="row g-3 mb-4 align-items-center">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="搜尋課程名稱...">
            </div>
            <div class="col-md-6">
                <div class="btn-group w-100" role="group" aria-label="Filter by status">
                    <button type="button" class="btn btn-primary filter-btn" data-status="all">全部</button>
                    <button type="button" class="btn btn-outline-secondary filter-btn" data-status="報名中">報名中</button>
                    <button type="button" class="btn btn-outline-secondary filter-btn" data-status="尚未開放">尚未開放</button>
                    <button type="button" class="btn btn-outline-secondary filter-btn" data-status="報名截止">報名截止</button>
                </div>
            </div>
        </div>
        
        <div class="row" id="course-list">
            <div class="col-12 text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">課程載入中...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 為了讓靜態頁面能運作，定義一個假的 JS 變數 -->
    <script>
        const IS_USER_AUTHENTICATED = true; // 可改為 false 來測試未登入狀態
        // 實際的課程列表由 main.js 動態載入
    </script>
    <!-- <script src="/static/js/main.js"></script> -->
</body>
</html>
