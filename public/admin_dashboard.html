<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>後台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 假設 style.css 位於 /static/css/style.css -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<!-- START: Firebase SDKs (v8 compat version) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<!-- END: Firebase SDKs -->

<!-- 您的主要 JavaScript 檔案 (務必放在 Firebase SDK 之後) -->
<script src="/js/main.js"></script>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">課程報名系統</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-user-section">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">所有課程</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my_courses.html">我報名的課</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="admin_dashboard.html">後台管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">你好, Joy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">登出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">課程管理</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="admin_all_registrations.html" class="btn btn-custom-purple-outline me-2">查看所有報名紀錄</a>
                <a href="admin_course_form.html" class="btn btn-primary">新增課程</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-sm" id="admin-course-list-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>課程名稱</th>
                        <th>上課時間</th>
                        <th>狀態</th>
                        <th>開放報名時間</th>
                        <th>報名截止時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="admin-course-list">
                    <!-- 課程列表將由 main.js 動態載入於此 -->
                </tbody>
            </table>
        </div>

        <div class="modal fade" id="registrantsModal" tabindex="-1" aria-labelledby="registrantsModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="registrantsModalLabel">報名者列表</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <table class="table">
                    <thead>
                        <tr><th>使用者名稱</th><th>上課時間</th><th>報名時間</th></tr>
                    </thead>
                    <tbody id="registrantsList">
                    </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
