<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我報名的課程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 假設 style.css 位於 /static/css/style.css -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<!-- START: Firebase SDKs (v8 compat version) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<!-- END: Firebase SDKs -->

<!-- 您的主要 JavaScript 檔案 (務必放在 Firebase SDK 之後) -->
<script src="/js/main.js"></script>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">課程報名系統</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-user-section">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">所有課程</a>
                    </li>
                    <!-- 範例：已登入狀態 -->
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="my_courses.html">我報名的課</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin_dashboard.html">後台管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">你好, Joy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">登出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">我的課程</h1>
        </div>
        <!-- 篩選按鈕 -->
        <div class="row g-3 mb-4 align-items-center">
            <div class="col-md-8 mx-auto">
                <div class="btn-group w-100" role="group" aria-label="Filter my courses by status">
                    <button type="button" class="btn btn-primary my-course-filter-btn" data-status="all">全部</button>
                    <button type="button" class="btn btn-outline-secondary my-course-filter-btn" data-status="課程即將開始">即將開始</button>
                    <button type="button" class="btn btn-outline-secondary my-course-filter-btn" data-status="課程進行中">進行中</button>
                    <button type="button" class="btn btn-outline-secondary my-course-filter-btn" data-status="課程已結束">已結束</button>
                </div>
            </div>
        </div>
        <div class="row" id="my-course-list">
            <!-- 課程卡片將由 main.js 動態載入於此 -->
            <div class="col-12">
                <div class="d-flex justify-content-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
